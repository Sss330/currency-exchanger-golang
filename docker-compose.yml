services:
  postgres:
    container_name: currency-exchanger-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: currency-exchanger
    ports:
      - "8765:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
  